# Deploy with:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Using --env-file .env.prod does two things:
#   1. Feeds variables into the YAML for ${VAR} substitution (used by db/redis services)
#   2. The app service reads its full config from .env.prod via env_file below

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: mould-app-prod
    container_name: mould_app_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mould_network
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public

  web:
    image: nginx:alpine
    container_name: mould_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - mould_network

  db:
    image: mysql:8.0
    container_name: mould_db_prod
    restart: unless-stopped
    # MySQL reads MYSQL_* vars, not from .env.prod directly.
    # ${VAR} here is substituted at compose parse time via --env-file .env.prod.
    # MYSQL_RANDOM_ROOT_PASSWORD avoids the need to manage a root password in production.
    # The app connects as ${DB_USERNAME}, not root.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata_prod:/var/lib/mysql
    networks:
      - mould_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: mould_redis_prod
    restart: unless-stopped
    volumes:
      - redisdata_prod:/data
    networks:
      - mould_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mould_network:
    driver: bridge

volumes:
  app_storage:
  app_public:
  dbdata_prod:
  redisdata_prod:
