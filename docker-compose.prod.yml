services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: mould-app-prod
    container_name: mould_app_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-mould_tracking}
      - DB_USERNAME=${DB_USERNAME:-mould_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mould_network
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public

  web:
    image: nginx:alpine
    container_name: mould_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - mould_network

  db:
    image: mysql:8.0
    container_name: mould_db_prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mould_tracking}
      MYSQL_USER: ${DB_USERNAME:-mould_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata_prod:/var/lib/mysql
    networks:
      - mould_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: mould_redis_prod
    restart: unless-stopped
    volumes:
      - redisdata_prod:/data
    networks:
      - mould_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mould_network:
    driver: bridge

volumes:
  app_storage:
  app_public:
  dbdata_prod:
  redisdata_prod:
